name: Build and publish Fenliu rule catalog

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      allow_large_change:
        description: Allow an intentional app-set or unusually large rule-count change
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: fenliu-catalog-publish
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      archive_changed: ${{ steps.validate.outputs.archive_changed }}
      version: ${{ steps.build.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install signature verifier
        run: sudo apt-get update && sudo apt-get install --yes usign

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Read previous published release
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin catalog >/dev/null 2>&1; then
            git fetch --no-tags origin catalog:refs/remotes/origin/catalog
            mkdir -p previous/stable
            git show origin/catalog:stable/manifest.json > previous/stable/manifest.json
            git show origin/catalog:stable/catalog.tar.gz > previous/stable/catalog.tar.gz
            echo "path=previous/stable" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build unsigned candidate
        id: build
        shell: bash
        run: |
          set -euo pipefail
          version="$(TZ=Asia/Shanghai date +%Y.%m.%d).${GITHUB_RUN_NUMBER}"
          generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python build_catalog.py --output dist/stable --version "$version" --generated-at "$generated_at"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate candidate and compare changes
        id: validate
        continue-on-error: true
        shell: bash
        env:
          PREVIOUS_PATH: ${{ steps.previous.outputs.path }}
          ALLOW_LARGE_CHANGE: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_large_change || false }}
        run: |
          set +e
          args=(--candidate dist/stable --report-json candidate-report.json --report-markdown candidate-report.md)
          if [[ -n "$PREVIOUS_PATH" ]]; then args+=(--previous "$PREVIOUS_PATH"); fi
          if [[ "$ALLOW_LARGE_CHANGE" == "true" ]]; then args+=(--allow-large-change); fi
          python validate_release.py "${args[@]}"
          status=$?
          archive_changed="$(python -c 'import json; print(str(json.load(open("candidate-report.json"))["archive_changed"]).lower())')"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "archive_changed=$archive_changed" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Stop on rejected candidate
        if: steps.validate.outputs.exit_code != '0'
        shell: bash
        run: exit 1

      - name: Record unchanged catalog
        if: github.event_name != 'pull_request' && steps.validate.outputs.archive_changed == 'false'
        run: echo "Upstream rules are unchanged; signing and publishing are skipped."

      - name: Sign and verify release
        if: github.event_name != 'pull_request' && steps.validate.outputs.archive_changed == 'true'
        shell: bash
        env:
          CATALOG_SECRET_KEY_B64: ${{ secrets.FENLIU_CATALOG_SECRET_KEY_B64 }}
          PREVIOUS_PATH: ${{ steps.previous.outputs.path }}
          ALLOW_LARGE_CHANGE: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_large_change || false }}
        run: |
          set -euo pipefail
          if [[ -z "$CATALOG_SECRET_KEY_B64" ]]; then
            echo "FENLIU_CATALOG_SECRET_KEY_B64 is not configured" >&2
            exit 1
          fi
          secret_file="$RUNNER_TEMP/catalog.sec"
          trap 'rm -f "$secret_file"' EXIT
          printf '%s' "$CATALOG_SECRET_KEY_B64" | base64 --decode > "$secret_file"
          chmod 600 "$secret_file"
          usign -S -m dist/stable/manifest.json -s "$secret_file" -x dist/stable/manifest.json.sig
          rm -f "$secret_file"
          trap - EXIT
          args=(--candidate dist/stable --public-key catalog.pub --require-signature --report-json candidate-report.json --report-markdown candidate-report.md)
          if [[ -n "$PREVIOUS_PATH" ]]; then args+=(--previous "$PREVIOUS_PATH"); fi
          if [[ "$ALLOW_LARGE_CHANGE" == "true" ]]; then args+=(--allow-large-change); fi
          python validate_release.py "${args[@]}"

      - name: Upload candidate and change report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-candidate-${{ steps.build.outputs.version || github.run_number }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            dist/stable/
            candidate-report.json
            candidate-report.md

  publish:
    needs: catalog
    if: github.event_name != 'pull_request' && needs.catalog.result == 'success' && needs.catalog.outputs.archive_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out source with publishing credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified signed candidate
        uses: actions/download-artifact@v4
        with:
          name: catalog-candidate-${{ needs.catalog.outputs.version }}
          path: .publish-artifact

      - name: Publish catalog branch
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.catalog.outputs.version }}
        run: |
          set -euo pipefail
          publish_source="$RUNNER_TEMP/fenliu-pages"
          mkdir -p "$publish_source"
          cp -a .publish-artifact/dist/stable "$publish_source/stable"
          touch "$publish_source/.nojekyll"
          if git show-ref --verify --quiet refs/remotes/origin/catalog; then
            git switch --force-create catalog-publish origin/catalog
          else
            git switch --orphan catalog-publish
            git rm -r --ignore-unmatch .
          fi
          git rm -r --ignore-unmatch stable .nojekyll
          cp -a "$publish_source/stable" ./stable
          cp "$publish_source/.nojekyll" ./.nojekyll
          git add stable .nojekyll
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "publish: catalog $RELEASE_VERSION"
          git push origin HEAD:catalog
